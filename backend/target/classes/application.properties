# Spring Boot Port
server.port=8080

# Database Configuration (Supabase PostgreSQL Connection)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.your-project-id.supabase.co:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your-supabase-db-password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' automatically updates the PostgreSQL database tables to match Java JPA models
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration - OAuth2 Resource Server for Supabase JWT Validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER:https://your-project-id.supabase.co/auth/v1}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWT_JWKS:https://your-project-id.supabase.co/auth/v1/.well-known/jwks.json}

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
