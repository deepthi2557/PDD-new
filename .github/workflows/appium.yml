name: Appium E2E Test Suite & Excel Report Generator

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-e2e-tests:
    name: Run 345 Appium E2E Test Cases & Build Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pytest

      - name: Execute Appium 345 E2E Test Suite
        env:
          HEADLESS: "true"
          TARGET_URL: "https://pdd-new.vercel.app/"
        run: |
          python appium_test_suite/run_all_appium_tests.py

      - name: Upload Excel Test Analysis Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-analysis-report-excel
          path: appium_test_suite/appium_test_analysis_report.xlsx
          retention-days: 30
