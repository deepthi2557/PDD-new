name: Appium E2E Test Suite & Excel Report Generator

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-e2e-tests:
    name: Run 345 Appium E2E Test Cases & Build Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "selenium_tests/requirements.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pytest

      - name: Execute Appium 345 E2E Test Suite
        env:
          HEADLESS: "true"
          TARGET_URL: "https://pdd-new.vercel.app/"
        run: |
          python appium_test_suite/run_all_appium_tests.py

      - name: Generate CSV Export
        if: always()
        run: python export_tests_to_csv.py

      - name: Upload Excel & CSV Test Analysis Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-analysis-report-excel
          path: |
            appium_test_suite/appium_test_analysis_report.xlsx
            appium_tested_actions.csv
          retention-days: 30
