name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  setup-node:
    name: Setup Node.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies & Build Web Bundle
        run: |
          cd Frontend
          npm install --legacy-peer-deps || npm install
          npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: Frontend/dist
          retention-days: 30

  security-assessment:
    name: Security Assessment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install openpyxl

      - name: Run Security SAST Assessment
        run: |
          python -m selenium_tests.run_security_assessment

      - name: Upload Security Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: selenium_tests/security_assessment_report.xlsx
          retention-days: 30

  selenium-tests:
    name: Selenium Web Tests
    needs: [setup-node, security-assessment]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "selenium_tests/requirements.txt"

      - name: Install Selenium & Excel Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r selenium_tests/requirements.txt

      - name: Run Selenium 340 E2E Test Suite
        env:
          HEADLESS: "true"
          TEST_BASE_URL: "https://pdd-new.vercel.app/"
        run: |
          python -m selenium_tests.run_tests

      - name: Upload Selenium Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: selenium_tests/selenium_test_analysis_report.xlsx
          retention-days: 30

  appium-tests:
    name: Appium Mobile Tests
    needs: [setup-node, security-assessment]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install openpyxl

      - name: Run Appium 345 E2E Test Suite
        run: |
          python appium_test_suite/run_all_appium_tests.py

      - name: Upload Appium Excel Analysis Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-e2e-test-analysis-report
          path: appium_test_suite/appium_test_analysis_report.xlsx
          retention-days: 30

  load-tests:
    name: Load & Performance Tests
    needs: [setup-node, security-assessment]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install openpyxl

      - name: Run Baseline Load Performance Tests (100 Virtual Users)
        env:
          TEST_BASE_URL: "https://pdd-new.vercel.app/"
          LOAD_TEST_USERS: "100"
          LOAD_TEST_DURATION: "60"
        run: |
          python -m load_tests.run_load_tests

      - name: Upload Load Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-report
          path: load_tests/load_test_report.xlsx
          retention-days: 30

  summary:
    name: Test Summary & Master Report Publisher
    needs: [setup-node, security-assessment, selenium-tests, appium-tests, load-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Reporting Dependencies
        run: pip install openpyxl

      - name: Download Security Report Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: security-report
          path: selenium_tests/

      - name: Download Selenium Report Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: selenium-report
          path: selenium_tests/

      - name: Download Appium Report Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: appium-e2e-test-analysis-report
          path: appium_test_suite/

      - name: Download Load Report Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: load-report
          path: load_tests/

      - name: Compile Master Excel & CSV Reports
        run: |
          python generate_github_testing_actions_excel.py
          python export_tests_to_csv.py

      - name: Upload Master Excel & CSV Reports Artifact Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-testing-actions-master-report
          path: |
            github_testing_actions_master_report.xlsx
            github_testing_actions.xlsx
            selenium_tested_actions.csv
            appium_tested_actions.csv
            selenium_and_appium_tested_actions.csv
          retention-days: 30

      - name: Compile Pipeline Summary Dashboard
        run: |
          echo "# 🚀 GitHub Actions E2E & QA Automation Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Testing Reports Directly from this GitHub Run" >> $GITHUB_STEP_SUMMARY
          echo "> **Direct Artifact Download:** Scroll to the **Artifacts** section at the bottom of this run page and click **\`github-testing-actions-master-report\`** to download all Excel & CSV files in one zip." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Report Name | Format | Actions Covered | Direct GitHub Download Link |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| **Master Testing Actions Report** | \`.xlsx\` | 706 Actions (Selenium, Appium, Load, SAST) | [⬇️ Download Excel (Master)](https://github.com/deepthi2557/PDD-new/raw/main/github_testing_actions_master_report.xlsx) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Combined Testing Actions** | \`.csv\` | 690 Actions (Selenium + Appium) | [⬇️ Download CSV (Combined)](https://github.com/deepthi2557/PDD-new/raw/main/selenium_and_appium_tested_actions.csv) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Selenium Web Actions** | \`.csv\` | 345 E2E Browser Actions | [⬇️ Download CSV (Selenium)](https://github.com/deepthi2557/PDD-new/raw/main/selenium_tested_actions.csv) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Appium Mobile Actions** | \`.csv\` | 345 E2E Mobile Actions | [⬇️ Download CSV (Appium)](https://github.com/deepthi2557/PDD-new/raw/main/appium_tested_actions.csv) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Pipeline Jobs Execution Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job Name | Status | Artifact Produced |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Setup Node.js** | ✅ PASSED | \`web-build\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Security Assessment** | ✅ PASSED | \`security-report\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Selenium Web Tests** | ✅ PASSED | \`selenium-report\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Appium Mobile Tests** | ✅ PASSED | \`appium-e2e-test-analysis-report\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Load & Performance Tests** | ✅ PASSED | \`load-report\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Master Testing Reports Bundle** | ✅ PASSED | \`github-testing-actions-master-report\` |" >> $GITHUB_STEP_SUMMARY
