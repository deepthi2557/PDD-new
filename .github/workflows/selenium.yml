name: Selenium E2E Tests & Excel Report Generator

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-e2e-tests:
    name: Run 340 Selenium E2E Test Cases & Build Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "selenium_tests/requirements.txt"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install System Dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y wget unzip libgconf-2-4 || true

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r selenium_tests/requirements.txt

      - name: Build & Run Local App (or target Vercel URL)
        env:
          HEADLESS: "true"
          TEST_BASE_URL: "https://pdd-new.vercel.app/"
        run: |
          echo "Target Base URL: $TEST_BASE_URL"

      - name: Execute Selenium E2E Test Suite
        env:
          HEADLESS: "true"
          TEST_BASE_URL: "https://pdd-new.vercel.app/"
        run: |
          python -m selenium_tests.run_tests

      - name: Upload Excel Test Analysis Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-analysis-report-excel
          path: selenium_tests/selenium_test_analysis_report.xlsx
          retention-days: 30
